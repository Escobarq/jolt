name: Deploy Joltv documentation

on:
  push:
    branches: [master]
    paths:
      - 'frontend-docs/**'
      - '.github/workflows/joltv-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: joltv-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-docs/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /Joltv
          SITE_URL: https://escobarq.github.io/Joltv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
