[package]
name = "jolt"
version = "0.1.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.9"
hex = "0.4.3"
notify = "8.2.0"
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
toml_edit = "0.25.13"
walkdir = "2.5.0"
zip = "8.6.0"
