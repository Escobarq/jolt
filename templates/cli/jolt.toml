[project]
name = "{{project_name}}"
version = "0.1.0"
java_version = "21"

[dependencies]
"com.williamcallahan:tui4j" = "0.3.1-preview"

[dev-dependencies]
"org.junit.jupiter:junit-jupiter-api" = "5.10.2"

[graalvm]
enabled = false
name = "{{project_name}}-cli"
reflection_config = "src/main/resources/reflect-config.json"
args = [
    "--no-fallback",
    "-H:+ReportExceptionStackTraces",
    "--initialize-at-build-time"
]
